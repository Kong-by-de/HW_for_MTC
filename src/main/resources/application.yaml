server:
  port: 8080

app:
  name: "Todo Manager"
  version: "1.0.0"

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      enabled: true
  profiles:
    active: dev

---
spring:
  config:
    activate:
      on-profile: dev
  logging:
    level:
      com.mipt.aleksandrivanovich.second_sem.hw_1: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod
  logging:
    level:
      com.mipt.aleksandrivanovich.second_sem.hw_1: INFO